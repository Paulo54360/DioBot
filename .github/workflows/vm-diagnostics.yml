name: VM Diagnostics

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Azure Resource Group'
        required: true
        default: 'projet-docker-rg'
      vm_name:
        description: 'VM Name'
        required: true
        default: 'projet-docker-vm01'

jobs:
  collect-diagnostics:
    runs-on: ubuntu-latest
    
    steps:
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Collect VM Diagnostics
      env:
        RG: ${{ github.event.inputs.resource_group }}
        VM: ${{ github.event.inputs.vm_name }}
      run: |
        echo "📋 Collecte des diagnostics depuis la VM..."
        echo ""
        echo "=========================================="
        echo "== cloud-init status =="
        echo "=========================================="
        az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript \
          --scripts "cloud-init status || true" \
          --query 'value[0].message' -o tsv 2>/dev/null | grep -v "This is a sample script" | grep -v "Optional parameters" | grep -v "Enable succeeded" | grep -v "\[std" || true
        echo ""
        echo "=========================================="
        echo "== cloud-init-output.log (tail 300) =="
        echo "=========================================="
        az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript \
          --scripts "tail -n 300 /var/log/cloud-init-output.log || true" \
          --query 'value[0].message' -o tsv 2>/dev/null | grep -v "This is a sample script" | grep -v "Optional parameters" | grep -v "Enable succeeded" | grep -v "\[std" | tail -n 300 || true
        echo ""
        echo "=========================================="
        echo "== systemctl status docker =="
        echo "=========================================="
        az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript \
          --scripts "systemctl status docker --no-pager || true" \
          --query 'value[0].message' -o tsv 2>/dev/null | grep -v "This is a sample script" | grep -v "Optional parameters" | grep -v "Enable succeeded" | grep -v "\[std" || true
        echo ""
        echo "=========================================="
        echo "== docker ps -a =="
        echo "=========================================="
        az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript \
          --scripts "docker ps -a || true" \
          --query 'value[0].message' -o tsv 2>/dev/null | grep -v "This is a sample script" | grep -v "Optional parameters" | grep -v "Enable succeeded" | grep -v "\[std" || true
        echo ""
        echo "=========================================="
        echo "== docker logs n8n (tail 200) =="
        echo "=========================================="
        az vm run-command invoke -g "$RG" -n "$VM" --command-id RunShellScript \
          --scripts "docker logs --tail 200 n8n 2>&1 || true" \
          --query 'value[0].message' -o tsv 2>/dev/null | grep -v "This is a sample script" | grep -v "Optional parameters" | grep -v "Enable succeeded" | grep -v "\[std" | tail -n 200 || true
      shell: /usr/bin/bash -e {0}
    
    - name: Get VM IP
      env:
        RG: ${{ github.event.inputs.resource_group }}
        VM: ${{ github.event.inputs.vm_name }}
      run: |
        echo "=========================================="
        echo "== VM IP Address =="
        echo "=========================================="
        VM_IP=$(az vm show -d -g "$RG" -n "$VM" --query publicIps -o tsv 2>/dev/null || echo "Unable to retrieve IP")
        echo "VM IP: $VM_IP"
      shell: /usr/bin/bash -e {0}
